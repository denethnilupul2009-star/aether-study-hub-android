name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Aether Study Hub APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Find settings.gradle and Build APK
        run: |
          yes | sdkmanager --licenses || true
          # settings.gradle ගොනුව ඇති ෆෝල්ඩරය ස්වයංක්‍රීයව සොයාගෙන එම ස්ථානයට යාම
          PROJECT_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
          echo "Project directory found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Study-Hub-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 7
